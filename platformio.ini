; Temperature control test stand - STM32F103C8T6 "Blue Pill" (STM32duino core)
; Build and flash one mode at a time, e.g.:
;   pio run -e pid -t upload
; Override any value from firmware/include/config.h with build_flags, e.g. -DSETPOINT_C=60.0f
; For a MAX6675 board add -DSENSOR_MAX6675 to [common] build_flags.

[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
default_envs = openloop, onoff, pid

[common]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -DSERIAL_UART_INSTANCE=1

[env:openloop]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags} -DMODE_OPENLOOP

[env:onoff]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags} -DMODE_ONOFF

[env:pid]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags} -DMODE_PID
